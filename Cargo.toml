[package]
name = "cosmic-ext-boards"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A Kanban app for the COSMIC™ desktop."
repository = "https://github.com/cosmic-ext-orbit/cosmic-ext-boards"

[dependencies]
directories = "6"
jiff = { version = "0.2", features = ["serde"] }
rusqlite = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"

features = ["about", "wgpu"]

[target.'cfg(target_os = "linux")'.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["single-instance"]
